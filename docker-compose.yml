name: ai-job-screening-agent

services:
  mysql:
    image: mysql:8.0
    container_name: ai-job-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_job_agent
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ai-job-agent-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: ai-job-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - ai-job-agent-redis-data:/data

volumes:
  ai-job-agent-mysql-data:
  ai-job-agent-redis-data:
